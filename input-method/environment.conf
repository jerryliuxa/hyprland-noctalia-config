# Optional input-method environment variables.
# This file is a reference only; it is not sourced automatically.
# Native Wayland applications should prefer the Wayland text-input protocol.
# Set only for applications that need the GTK/Qt IM module, especially XWayland apps.
#
# XMODIFIERS=@im=fcitx
# GTK_IM_MODULE=fcitx
# QT_IM_MODULE=fcitx
# SDL_IM_MODULE=fcitx
